name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Lets you trigger a redeploy manually from the Actions tab without a new commit.
  workflow_dispatch:

# One deployment at a time; a new push cancels an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # GITHUB_PAGES=true is what next.config.ts checks to turn on
      # basePath/assetPrefix for the /German-Jobkonnektor subpath. Local
      # `npm run build` / `npm run dev` are unaffected and stay unprefixed.
      - name: Build static export
        run: npm run build
        env:
          GITHUB_PAGES: "true"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
